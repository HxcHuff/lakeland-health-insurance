# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "lakeland-health-insurance"

[setup]
script = '''
# Install dependencies in parallel to maximize CPU efficiency
pip install --upgrade pip && pip install -r requirements.txt &
npm ci &

# Wait for both installations to finish successfully
wait

# Ensure script execution permissions and run local initialization
chmod +x ./run/setup.sh
./run/setup.sh'''

[cleanup]
script = '''
# Gracefully kill any dangling local Node or Python processes tied to this project
pkill -f "node" || true
pkill -f "python" || true

# Force wipe application-level temporary files and caches
rm -rf .cache/tmp .next .vite_cache __pycache__ .pytest_cache || true'''

[[actions]]
name = "Start App"
icon = "tool"
command = '''
# This automatically runs the fallback script provided in your codebase
chmod +x ./run/setup.sh
./run/setup.sh --start || npm run dev || python backend.py'''

[[actions]]
name = "Test Code"
icon = "tool"
command = '''
# Triggers default Node test runners or Python unit testing suites
npm test || pytest || python -m unittest'''

[[actions]]
name = "Verify Project"
icon = "tool"
command = "npm run lint || flake8 . || true"
