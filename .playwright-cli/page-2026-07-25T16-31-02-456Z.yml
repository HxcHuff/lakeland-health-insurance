        - text: "Latest from the blog:"
        - link [ref=e88] [cursor=pointer]:
          - /url: /blog/health-insurance-tampa-2026.html
          - strong [ref=e89]: Health Insurance in Tampa, FL — What Changed in 2026
    - generic [ref=e91]:
      - heading "Frequently Asked Questions" [level=2] [ref=e92]
      - generic [ref=e93]:
        - heading "Who is the best health insurance broker in Tampa?" [level=3] [ref=e94]
        - paragraph [ref=e95]: "David Huff is a licensed Florida health insurance broker (FL #W371813, NPN 18213932) serving Tampa and Hillsborough County. He specializes in ACA Marketplace plans and Medicare with free, no-pressure consultations."
      - generic [ref=e96]:
        - heading "How much does health insurance cost in Tampa?" [level=3] [ref=e97]
        - paragraph [ref=e98]: Costs vary based on income, age, and plan type. Many Tampa residents qualify for ACA subsidies that reduce premiums significantly — some to $0/month. A free consultation can show you exactly what you qualify for.
      - generic [ref=e99]:
        - heading "Can I enroll in ACA coverage outside of Open Enrollment?" [level=3] [ref=e100]
        - paragraph [ref=e101]: Yes, if you have a qualifying life event — such as losing employer coverage, moving to Tampa, marriage, or a new child. You typically have 60 days to enroll through a Special Enrollment Period.
      - generic [ref=e102]:
        - heading "Do I need a broker or can I enroll myself?" [level=3] [ref=e103]
        - paragraph [ref=e104]: You can enroll yourself at Healthcare.gov, but a broker ensures your application is structured correctly, your subsidy is maximized, and your plan fits your actual needs. There's no additional cost — brokers are paid by the carriers.
      - generic [ref=e105]:
        - heading "What carriers are available in Hillsborough County?" [level=3] [ref=e106]
        - paragraph [ref=e107]: ACA carriers in Hillsborough County include Ambetter, Molina, Oscar, and UnitedHealthcare. Medicare options vary by plan type. I'll show you what's available based on your ZIP code.
    - generic [ref=e110]:
