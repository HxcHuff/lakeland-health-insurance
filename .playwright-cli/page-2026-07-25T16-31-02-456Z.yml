    - generic [ref=e83]:
      - heading "Tampa Area Communities I Serve" [level=2] [ref=e84]
      - paragraph [ref=e85]: I work with residents across the greater Tampa Bay area, including Tampa, Brandon, Riverview, Plant City, Temple Terrace, Town 'N' Country, Carrollwood, Westchase, Seffner, Thonotosassa, Valrico, Bloomingdale, Fish Hawk, Ruskin, Apollo Beach, Dover, Mango, and surrounding Hillsborough County communities.
      - paragraph [ref=e86]: Whether you're in South Tampa or out near the I-4 corridor toward Lakeland, enrollment works the same way — and I make it simple.
