    - generic [ref=e45]:
      - heading "Health Insurance Options in Tampa" [level=2] [ref=e46]
      - paragraph [ref=e47]: Tampa and Hillsborough County residents have access to a range of health coverage options. What's available to you depends on your age, income, employment status, and household size.
      - list [ref=e48]:
        - listitem [ref=e49]:
          - strong [ref=e50]: ACA Marketplace plans
          - text: — Income-based pricing with potential subsidies. Carriers in Hillsborough County include Ambetter, Molina, Oscar, and UnitedHealthcare.
        - listitem [ref=e51]:
          - strong [ref=e52]: Medicare
          - text: — Medicare Advantage, Medigap, and Part D for residents 65+ or with qualifying disabilities.
        - listitem [ref=e53]:
          - strong [ref=e54]: Short-term medical
          - text: — Gap coverage for transitions between jobs or plans.
        - listitem [ref=e55]:
          - strong [ref=e56]: Dental, vision, and supplemental
          - text: — Standalone or bundled with primary coverage.
      - paragraph [ref=e57]: I'll walk you through what fits your situation. No guesswork.
