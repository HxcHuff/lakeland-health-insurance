    - generic [ref=e99]:
      - heading "Lake Alfred FAQs" [level=2] [ref=e100]
      - heading "What should I have ready before a plan review?" [level=3] [ref=e101]
      - paragraph [ref=e102]: Have your doctors, preferred pharmacy, prescription list, current plan card if you have one, household size, estimated annual income, and target coverage start date.
      - heading "Can I enroll outside Open Enrollment?" [level=3] [ref=e103]
      - paragraph [ref=e104]: Possibly. ACA coverage outside Open Enrollment usually requires a Special Enrollment Period, such as losing employer coverage, moving, marriage, birth, or aging off a parent's plan. Medicare has separate timing rules.
      - heading "Does using a broker change my premium?" [level=3] [ref=e105]
      - paragraph [ref=e106]: No. You pay the same plan premium whether you enroll directly or with broker help. The difference is that you get plan review, enrollment guidance, and follow-up support.
