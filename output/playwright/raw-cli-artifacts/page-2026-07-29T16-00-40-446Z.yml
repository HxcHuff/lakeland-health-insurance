  - generic [ref=f8e85]:
    - paragraph [ref=f8e86]: How I Work
    - heading "Direct, practical, and built around your real life." [level=2] [ref=f8e87]
    - generic [ref=f8e88]:
      - generic [ref=f8e89]:
        - heading "We start with your details" [level=3] [ref=f8e90]
        - paragraph [ref=f8e91]: Your doctors, prescriptions, household income, preferred hospitals, budget, and timeline matter more than a flashy premium. I use those details to narrow the options.
      - generic [ref=f8e92]:
        - heading "I explain the tradeoffs" [level=3] [ref=f8e93]
        - paragraph [ref=f8e94]: Every plan has tradeoffs. I help you understand networks, deductibles, copays, drug tiers, out-of-pocket exposure, referrals, and what those details mean day to day.
      - generic [ref=f8e95]:
        - heading "No pressure, no scripts" [level=3] [ref=f8e96]
        - paragraph [ref=f8e97]: You will not get a corporate sales routine. You get a real conversation, clear next steps, and enough context to make a decision with confidence.
      - generic [ref=f8e98]:
        - heading "I stay practical" [level=3] [ref=f8e99]
        - paragraph [ref=f8e100]: A lower premium or longer brochure does not automatically make coverage the better fit. The right review starts with your care, your risk, and your budget.
      - generic [ref=f8e101]:
        - heading "Local insight matters" [level=3] [ref=f8e102]
        - paragraph [ref=f8e103]: Lakeland and Polk County networks can be confusing. I pay attention to local systems like Watson Clinic, Lakeland Regional Health, BayCare, Orlando Health, and nearby provider access.
      - generic [ref=f8e104]:
        - heading "I help beyond one page" [level=3] [ref=f8e105]
        - paragraph [ref=f8e106]: Coverage questions do not always end after enrollment. When you need help understanding a card, comparing renewal options, or preparing for a plan change, you can reach out.
  - generic [ref=f8e108]:
    - paragraph [ref=f8e109]: Who I Serve
    - heading "Health insurance help for people who want a human guide." [level=2] [ref=f8e110]
    - paragraph [ref=f8e111]: Most clients come to me because they are tired of guessing. They want someone who can compare options, translate the fine print, and keep the conversation grounded.
