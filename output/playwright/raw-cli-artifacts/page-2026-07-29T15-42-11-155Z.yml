      - heading "What Lakeland Health Insurance Helps With" [level=2] [ref=e112]
      - paragraph [ref=e113]: "Lakeland Health Insurance is led by David Huff, a licensed Florida broker (FL #W371813) helping individuals, families, self-employed workers, and Medicare beneficiaries compare coverage from multiple carriers. The goal is not to sell every plan type. It is to narrow the choices to the ones that fit your doctors, prescriptions, budget, and enrollment window."
      - paragraph [ref=e114]: For ACA shoppers, that means checking Marketplace subsidy eligibility and real network fit. For Medicare shoppers, it means comparing Medicare Advantage, Medicare Supplement, and Part D around the doctors and medications you actually use. For supplemental coverage, it means explaining benefits, limits, and underwriting before you apply.
      - paragraph [ref=e115]:
        - strong [ref=e116]: "Service areas:"
        - text: Lakeland, Tampa, Winter Haven, Bartow, Haines City, Plant City, Polk County, Hillsborough County, and greater Central Florida. Licensed to serve clients in most U.S. states.
