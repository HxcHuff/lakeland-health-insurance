    - generic [ref=e211]:
      - paragraph [ref=e212]: Common Questions
      - heading "Health Insurance Questions for Lakeland Residents" [level=2] [ref=e213]
      - generic [ref=e214]:
        - heading "How do I get health insurance in Lakeland, FL?" [level=3] [ref=e215]
        - paragraph [ref=e216]: Lakeland residents can enroll in health insurance through the ACA Marketplace (Healthcare.gov), Medicare (if eligible), or private plans. A licensed local broker can compare options from multiple carriers with carrier-paid broker compensation. Call 863-640-3102 or visit the help form to start.
      - generic [ref=e217]:
        - heading "What does a health insurance broker cost in Florida?" [level=3] [ref=e218]
        - paragraph [ref=e219]: Licensed health insurance brokers in Florida are generally compensated by insurance carriers, not by clients. You pay the same premium whether you enroll directly or through a broker, and a broker can compare plans from multiple carriers to find the best fit for your budget and doctors.
      - generic [ref=e220]:
        - heading "When is open enrollment for health insurance in Florida?" [level=3] [ref=e221]
        - paragraph [ref=e222]: ACA Open Enrollment in Florida typically runs from November 1 through January 15 each year. Medicare Annual Enrollment runs October 15 through December 7. Outside these windows, you may still qualify for a Special Enrollment Period if you experience a qualifying life event such as losing job-based coverage, getting married, having a baby, or moving.
      - generic [ref=e223]:
        - heading "What is the difference between Medicare Advantage and Medicare Supplement?" [level=3] [ref=e224]
        - paragraph [ref=e225]: Medicare Advantage (Part C) is an alternative way to receive Medicare benefits through a private plan that often includes prescription drugs, dental, and vision, with network restrictions. Medicare Supplement (Medigap) works alongside Original Medicare to cover out-of-pocket costs, with higher premiums but broader provider flexibility.
      - generic [ref=e226]:
        - heading "What health insurance plans are available in Polk County?" [level=3] [ref=e227]
        - paragraph [ref=e228]: Polk County residents have access to ACA Marketplace plans from carriers including Ambetter, Molina, Oscar, UnitedHealthcare, and Wellpoint. Medicare beneficiaries can choose from Medicare Advantage, Medicare Supplement, and Part D plans. Supplemental options include dental, vision, life insurance, and fixed-indemnity Guard plans.
