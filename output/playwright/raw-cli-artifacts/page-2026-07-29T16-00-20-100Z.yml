  - generic [ref=f6e104]:
    - paragraph [ref=f6e105]: How I Work
    - heading "Direct, practical, and built around your real life." [level=2] [ref=f6e106]
    - generic [ref=f6e107]:
      - generic [ref=f6e108]:
        - heading "We start with your details" [level=3] [ref=f6e109]
        - paragraph [ref=f6e110]: Your doctors, prescriptions, household income, preferred hospitals, budget, and timeline matter more than a flashy premium. I use those details to narrow the options.
      - generic [ref=f6e111]:
        - heading "I explain the tradeoffs" [level=3] [ref=f6e112]
        - paragraph [ref=f6e113]: Every plan has tradeoffs. I help you understand networks, deductibles, copays, drug tiers, out-of-pocket exposure, referrals, and what those details mean day to day.
      - generic [ref=f6e114]:
        - heading "No pressure, no scripts" [level=3] [ref=f6e115]
        - paragraph [ref=f6e116]: You will not get a corporate sales routine. You get a real conversation, clear next steps, and enough context to make a decision with confidence.
      - generic [ref=f6e117]:
        - heading "I stay practical" [level=3] [ref=f6e118]
        - paragraph [ref=f6e119]: A lower premium or longer brochure does not automatically make coverage the better fit. The right review starts with your care, your risk, and your budget.
      - generic [ref=f6e120]:
        - heading "Local insight matters" [level=3] [ref=f6e121]
        - paragraph [ref=f6e122]: Lakeland and Polk County networks can be confusing. I pay attention to local systems like Watson Clinic, Lakeland Regional Health, BayCare, Orlando Health, and nearby provider access.
      - generic [ref=f6e123]:
        - heading "I help beyond one page" [level=3] [ref=f6e124]
        - paragraph [ref=f6e125]: Coverage questions do not always end after enrollment. When you need help understanding a card, comparing renewal options, or preparing for a plan change, you can reach out.
  - generic [ref=f6e127]:
    - paragraph [ref=f6e128]: Who I Serve
    - heading "Health insurance help for people who want a human guide." [level=2] [ref=f6e129]
    - paragraph [ref=f6e130]: Most clients come to me because they are tired of guessing. They want someone who can compare options, translate the fine print, and keep the conversation grounded.
    - generic [ref=f6e131]:
      - generic [ref=f6e132]:
        - heading "Individuals & Families" [level=3] [ref=f6e133]
        - paragraph [ref=f6e134]: ACA Marketplace plans, private options, short-term coverage, dental, vision, and life insurance for families trying to protect both health and budget.
      - generic [ref=f6e135]:
        - heading "Medicare Beneficiaries" [level=3] [ref=f6e136]
        - paragraph [ref=f6e137]: Plan reviews for people turning 65, retiring, moving, losing employer coverage, or comparing Medicare Advantage, Medigap, and Part D options.
      - generic [ref=f6e138]:
        - heading "Self-Employed Workers" [level=3] [ref=f6e139]
