  - generic [ref=f4e48]:
    - generic [ref=f4e49]:
      - paragraph [ref=f4e50]: Why I Do This
      - heading "Insurance should make life less confusing, not more." [level=2] [ref=f4e51]
      - paragraph [ref=f4e52]: "I'm David Huff, a licensed health insurance broker based in Lakeland, Florida. I help people compare health coverage when the choices feel overwhelming: turning 65, losing employer coverage, shopping ACA Marketplace plans, checking doctor networks, or trying to understand whether a supplemental plan is worth it."
      - paragraph [ref=f4e53]: "My approach is simple: I explain the tradeoffs directly, check the details that actually matter, and help you choose coverage that fits your doctors, prescriptions, budget, and timing. If a plan is not a good fit, I will tell you. If you need to slow down and compare, we slow down and compare."
      - paragraph [ref=f4e54]: My work is built around preparation, honesty, and attention to detail. As a parent, I also know health coverage is not theoretical. It matters when someone gets hurt, a prescription changes, or a bill shows up at the wrong time.
      - generic [ref=f4e55]: Insurance companies compensate brokers. Your premium is not increased for using David instead of enrolling directly with the carrier.
      - generic [ref=f4e56]: David is not a carrier, call center, or lead seller. You work with a licensed Florida broker who reviews plan details directly and uses your information only to help with coverage review, enrollment support, and follow-up.
    - complementary "Coverage review details" [ref=f4e57]:
      - heading "What David checks before you enroll" [level=3] [ref=f4e58]
      - list [ref=f4e59]:
        - listitem [ref=f4e60]: Doctors, specialists, hospitals, and local network access
        - listitem [ref=f4e61]: Prescriptions, pharmacy preferences, tiers, and prior authorizations
        - listitem [ref=f4e62]: Premiums, deductibles, copays, and yearly exposure
        - listitem [ref=f4e63]: Enrollment windows, subsidy eligibility, and plan change timing
      - paragraph [ref=f4e64]: Broker compensation is paid by carriers. Your premium is not increased for using David instead of enrolling directly with the carrier.
