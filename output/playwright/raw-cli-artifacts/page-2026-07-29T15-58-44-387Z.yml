  - generic [ref=f4e86]:
    - paragraph [ref=f4e87]: How I Work
    - heading "Direct, practical, and built around your real life." [level=2] [ref=f4e88]
    - generic [ref=f4e89]:
      - generic [ref=f4e90]:
        - heading "We start with your details" [level=3] [ref=f4e91]
        - paragraph [ref=f4e92]: Your doctors, prescriptions, household income, preferred hospitals, budget, and timeline matter more than a flashy premium. I use those details to narrow the options.
      - generic [ref=f4e93]:
        - heading "I explain the tradeoffs" [level=3] [ref=f4e94]
        - paragraph [ref=f4e95]: Every plan has tradeoffs. I help you understand networks, deductibles, copays, drug tiers, out-of-pocket exposure, referrals, and what those details mean day to day.
      - generic [ref=f4e96]:
        - heading "No pressure, no scripts" [level=3] [ref=f4e97]
        - paragraph [ref=f4e98]: You will not get a corporate sales routine. You get a real conversation, clear next steps, and enough context to make a decision with confidence.
      - generic [ref=f4e99]:
        - heading "I stay practical" [level=3] [ref=f4e100]
        - paragraph [ref=f4e101]: A lower premium or longer brochure does not automatically make coverage the better fit. The right review starts with your care, your risk, and your budget.
      - generic [ref=f4e102]:
        - heading "Local insight matters" [level=3] [ref=f4e103]
        - paragraph [ref=f4e104]: Lakeland and Polk County networks can be confusing. I pay attention to local systems like Watson Clinic, Lakeland Regional Health, BayCare, Orlando Health, and nearby provider access.
      - generic [ref=f4e105]:
        - heading "I help beyond one page" [level=3] [ref=f4e106]
        - paragraph [ref=f4e107]: Coverage questions do not always end after enrollment. When you need help understanding a card, comparing renewal options, or preparing for a plan change, you can reach out.
  - generic [ref=f4e109]:
    - paragraph [ref=f4e110]: Who I Serve
    - heading "Health insurance help for people who want a human guide." [level=2] [ref=f4e111]
    - paragraph [ref=f4e112]: Most clients come to me because they are tired of guessing. They want someone who can compare options, translate the fine print, and keep the conversation grounded.
