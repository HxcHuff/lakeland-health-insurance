  - generic [ref=f1e105]:
    - paragraph [ref=f1e106]: How I Work
    - heading "Direct, practical, and built around your real life." [level=2] [ref=f1e107]
    - generic [ref=f1e108]:
      - generic [ref=f1e109]:
        - heading "We start with your details" [level=3] [ref=f1e110]
        - paragraph [ref=f1e111]: Your doctors, prescriptions, household income, preferred hospitals, budget, and timeline matter more than a flashy premium. I use those details to narrow the options.
      - generic [ref=f1e112]:
        - heading "I explain the tradeoffs" [level=3] [ref=f1e113]
        - paragraph [ref=f1e114]: Every plan has tradeoffs. I help you understand networks, deductibles, copays, drug tiers, out-of-pocket exposure, referrals, and what those details mean day to day.
      - generic [ref=f1e115]:
        - heading "No pressure, no scripts" [level=3] [ref=f1e116]
        - paragraph [ref=f1e117]: You will not get a corporate sales routine. You get a real conversation, clear next steps, and enough context to make a decision with confidence.
      - generic [ref=f1e118]:
        - heading "I stay practical" [level=3] [ref=f1e119]
        - paragraph [ref=f1e120]: A lower premium or longer brochure does not automatically make coverage the better fit. The right review starts with your care, your risk, and your budget.
      - generic [ref=f1e121]:
        - heading "Local insight matters" [level=3] [ref=f1e122]
        - paragraph [ref=f1e123]: Lakeland and Polk County networks can be confusing. I pay attention to local systems like Watson Clinic, Lakeland Regional Health, BayCare, Orlando Health, and nearby provider access.
      - generic [ref=f1e124]:
        - heading "I help beyond one page" [level=3] [ref=f1e125]
        - paragraph [ref=f1e126]: Coverage questions do not always end after enrollment. When you need help understanding a card, comparing renewal options, or preparing for a plan change, you can reach out.
  - generic [ref=f1e128]:
    - paragraph [ref=f1e129]: Who I Serve
    - heading "Health insurance help for people who want a human guide." [level=2] [ref=f1e130]
    - paragraph [ref=f1e131]: Most clients come to me because they are tired of guessing. They want someone who can compare options, translate the fine print, and keep the conversation grounded.
