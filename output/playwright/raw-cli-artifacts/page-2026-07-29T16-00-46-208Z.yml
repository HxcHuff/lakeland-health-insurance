  - generic [ref=f9e81]:
    - paragraph [ref=f9e82]: How I Work
    - heading "Direct, practical, and built around your real life." [level=2] [ref=f9e83]
    - generic [ref=f9e84]:
      - generic [ref=f9e85]:
        - heading "We start with your details" [level=3] [ref=f9e86]
        - paragraph [ref=f9e87]: Your doctors, prescriptions, household income, preferred hospitals, budget, and timeline matter more than a flashy premium. I use those details to narrow the options.
      - generic [ref=f9e88]:
        - heading "I explain the tradeoffs" [level=3] [ref=f9e89]
        - paragraph [ref=f9e90]: Every plan has tradeoffs. I help you understand networks, deductibles, copays, drug tiers, out-of-pocket exposure, referrals, and what those details mean day to day.
      - generic [ref=f9e91]:
        - heading "No pressure, no scripts" [level=3] [ref=f9e92]
        - paragraph [ref=f9e93]: You will not get a corporate sales routine. You get a real conversation, clear next steps, and enough context to make a decision with confidence.
      - generic [ref=f9e94]:
        - heading "I stay practical" [level=3] [ref=f9e95]
        - paragraph [ref=f9e96]: A lower premium or longer brochure does not automatically make coverage the better fit. The right review starts with your care, your risk, and your budget.
      - generic [ref=f9e97]:
        - heading "Local insight matters" [level=3] [ref=f9e98]
        - paragraph [ref=f9e99]: Lakeland and Polk County networks can be confusing. I pay attention to local systems like Watson Clinic, Lakeland Regional Health, BayCare, Orlando Health, and nearby provider access.
      - generic [ref=f9e100]:
        - heading "I help beyond one page" [level=3] [ref=f9e101]
        - paragraph [ref=f9e102]: Coverage questions do not always end after enrollment. When you need help understanding a card, comparing renewal options, or preparing for a plan change, you can reach out.
  - generic [ref=f9e104]:
    - paragraph [ref=f9e105]: Who I Serve
    - heading "Health insurance help for people who want a human guide." [level=2] [ref=f9e106]
    - paragraph [ref=f9e107]: Most clients come to me because they are tired of guessing. They want someone who can compare options, translate the fine print, and keep the conversation grounded.
    - generic [ref=f9e108]:
      - generic [ref=f9e109]:
        - heading "Individuals & Families" [level=3] [ref=f9e110]
        - paragraph [ref=f9e111]: ACA Marketplace plans, private options, short-term coverage, dental, vision, and life insurance for families trying to protect both health and budget.
      - generic [ref=f9e112]:
        - heading "Medicare Beneficiaries" [level=3] [ref=f9e113]
        - paragraph [ref=f9e114]: Plan reviews for people turning 65, retiring, moving, losing employer coverage, or comparing Medicare Advantage, Medigap, and Part D options.
      - generic [ref=f9e115]:
        - heading "Self-Employed Workers" [level=3] [ref=f9e116]
        - paragraph [ref=f9e117]: Coverage guidance for freelancers, contractors, business owners, and people whose income or tax situation makes subsidies and plan selection more complicated.
      - generic [ref=f9e118]:
        - heading "Central Florida & Beyond" [level=3] [ref=f9e119]
        - paragraph [ref=f9e120]: Local help for Lakeland, Winter Haven, Bartow, Tampa, Plant City, and Polk County, with licensing to serve clients in many states.
