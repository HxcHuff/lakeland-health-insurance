    - generic [ref=f5e59]:
      - 'heading "Key Takeaways: Under-65 ACA Health Insurance" [level=2] [ref=f5e60]'
      - paragraph [ref=f5e61]: ACA Marketplace coverage is usually the main starting point for people under 65 who do not have employer coverage. Your cost depends on ZIP code, household size, estimated household income, age, and the plan you choose.
      - paragraph [ref=f5e62]: Open Enrollment runs November 1 through January 15 each year. Outside that window, a qualifying life event such as losing job coverage, moving, marriage, birth, or aging off a parent's plan may create a 60-day Special Enrollment Period.
      - paragraph [ref=f5e63]: "A licensed broker can help compare available options with carrier-paid broker compensation. David Huff (FL License #W371813) helps under-65 Lakeland and Polk County residents check subsidy eligibility, doctors, prescriptions, and plan timing before enrollment."
