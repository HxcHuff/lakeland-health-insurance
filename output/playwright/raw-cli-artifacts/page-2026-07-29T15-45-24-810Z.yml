    - generic [ref=f5e116]:
      - heading "Frequently Asked Questions About ACA Insurance in Lakeland" [level=2] [ref=f5e117]
      - generic [ref=f5e118]:
        - heading "How much does ACA health insurance cost in Lakeland, FL?" [level=3] [ref=f5e119]
        - paragraph [ref=f5e120]: ACA health insurance costs in Lakeland vary based on household income, age, county, plan selection, and current subsidy rules. Some Polk County residents qualify for premium tax credits, but exact costs should be estimated from current plan data and household income.
      - generic [ref=f5e121]:
        - heading "Do I qualify for ACA coverage if I'm self-employed?" [level=3] [ref=f5e122]
        - paragraph [ref=f5e123]: Yes. Self-employed individuals, freelancers, and 1099 contractors qualify for ACA Marketplace plans and may receive premium subsidies based on projected Modified Adjusted Gross Income (MAGI). Accurate income projection is important — overestimating or underestimating can affect subsidy amounts at tax time.
      - generic [ref=f5e124]:
        - heading "Can I get ACA health insurance outside of open enrollment?" [level=3] [ref=f5e125]
        - paragraph [ref=f5e126]: Yes. Outside the annual Open Enrollment Period (November 1–January 15), you can enroll through a Special Enrollment Period if you experience a qualifying life event. Common qualifying events include losing employer-sponsored coverage, getting married, having a baby, moving to a new state, or aging off a parent's plan. You have 60 days from the qualifying event to enroll.
      - generic [ref=f5e127]:
        - heading "What should I have ready for an ACA review?" [level=3] [ref=f5e128]
        - paragraph [ref=f5e129]: Have your ZIP code, household size, estimated household income, doctors, prescriptions, preferred pharmacy, and any recent coverage loss or life event ready. Those details determine subsidy eligibility and which options are worth reviewing.
      - generic [ref=f5e130]:
        - heading "Is there a penalty for not having health insurance in Florida?" [level=3] [ref=f5e131]
        - paragraph [ref=f5e132]: There is no federal tax penalty for not having health insurance as of 2019. Florida does not impose a state-level individual mandate penalty. However, going without coverage exposes you to full out-of-pocket costs for medical care. A single ER visit in Lakeland can cost $3,000–$15,000 without insurance.
