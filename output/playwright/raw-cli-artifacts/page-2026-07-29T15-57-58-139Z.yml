    - generic [ref=e68]:
      - paragraph [ref=e69]: Why I Do This
      - heading "Insurance should make life less confusing, not more." [level=2] [ref=e70]
      - paragraph [ref=e71]: "I'm David Huff, a licensed health insurance broker based in Lakeland, Florida. I help people compare health coverage when the choices feel overwhelming: turning 65, losing employer coverage, shopping ACA Marketplace plans, checking doctor networks, or trying to understand whether a supplemental plan is worth it."
      - paragraph [ref=e72]: "My approach is simple: I explain the tradeoffs directly, check the details that actually matter, and help you choose coverage that fits your doctors, prescriptions, budget, and timing. If a plan is not a good fit, I will tell you. If you need to slow down and compare, we slow down and compare."
      - paragraph [ref=e73]: My work is built around preparation, honesty, and attention to detail. As a parent, I also know health coverage is not theoretical. It matters when someone gets hurt, a prescription changes, or a bill shows up at the wrong time.
      - generic [ref=e74]: Insurance companies compensate brokers. Your premium is not increased for using David instead of enrolling directly with the carrier.
      - generic [ref=e75]: David is not a carrier, call center, or lead seller. You work with a licensed Florida broker who reviews plan details directly and uses your information only to help with coverage review, enrollment support, and follow-up.
    - complementary "Coverage review details" [ref=e76]:
      - heading "What David checks before you enroll" [level=3] [ref=e77]
      - list [ref=e78]:
        - listitem [ref=e79]: Doctors, specialists, hospitals, and local network access
        - listitem [ref=e80]: Prescriptions, pharmacy preferences, tiers, and prior authorizations
        - listitem [ref=e81]: Premiums, deductibles, copays, and yearly exposure
        - listitem [ref=e82]: Enrollment windows, subsidy eligibility, and plan change timing
      - paragraph [ref=e83]: Broker compensation is paid by carriers. Your premium is not increased for using David instead of enrolling directly with the carrier.
