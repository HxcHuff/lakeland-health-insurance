  - generic [ref=e105]:
    - paragraph [ref=e106]: How I Work
    - heading "Direct, practical, and built around your real life." [level=2] [ref=e107]
    - generic [ref=e108]:
      - generic [ref=e109]:
        - heading "We start with your details" [level=3] [ref=e110]
        - paragraph [ref=e111]: Your doctors, prescriptions, household income, preferred hospitals, budget, and timeline matter more than a flashy premium. I use those details to narrow the options.
      - generic [ref=e112]:
        - heading "I explain the tradeoffs" [level=3] [ref=e113]
        - paragraph [ref=e114]: Every plan has tradeoffs. I help you understand networks, deductibles, copays, drug tiers, out-of-pocket exposure, referrals, and what those details mean day to day.
      - generic [ref=e115]:
        - heading "No pressure, no scripts" [level=3] [ref=e116]
        - paragraph [ref=e117]: You will not get a corporate sales routine. You get a real conversation, clear next steps, and enough context to make a decision with confidence.
      - generic [ref=e118]:
        - heading "I stay practical" [level=3] [ref=e119]
        - paragraph [ref=e120]: A lower premium or longer brochure does not automatically make coverage the better fit. The right review starts with your care, your risk, and your budget.
      - generic [ref=e121]:
        - heading "Local insight matters" [level=3] [ref=e122]
        - paragraph [ref=e123]: Lakeland and Polk County networks can be confusing. I pay attention to local systems like Watson Clinic, Lakeland Regional Health, BayCare, Orlando Health, and nearby provider access.
      - generic [ref=e124]:
        - heading "I help beyond one page" [level=3] [ref=e125]
        - paragraph [ref=e126]: Coverage questions do not always end after enrollment. When you need help understanding a card, comparing renewal options, or preparing for a plan change, you can reach out.
  - generic [ref=e128]:
