      - paragraph [ref=f6e159]: This is a typical-case summary. Each plan's certificate of coverage controls. Review exclusions, waiting periods, annual maximums, and missing-tooth clauses before enrolling.
    - generic [ref=f6e160]:
      - heading "Nationwide enrollment support" [level=2] [ref=f6e161]
      - paragraph [ref=f6e162]: Use this page as a nationwide dental and vision self-enrollment starting point. Plan availability, provider networks, and pricing vary by state and ZIP code, so quote tools should use the ZIP where coverage will be used.
    - generic [ref=f6e163]:
      - heading "Frequently asked questions" [level=2] [ref=f6e164]
      - generic [ref=f6e165]:
        - heading "Do I really need standalone dental insurance?" [level=3] [ref=f6e166]
        - paragraph [ref=f6e167]: It depends on your dental history and budget. Adult dental is often separate from medical coverage. If you only need cleanings, paying cash or using a dental savings plan is often cheaper. If you know you have major work coming, a PPO dental plan can offset the cost.
      - generic [ref=f6e168]:
        - heading "What's the difference between PPO, DHMO, and a dental savings plan?" [level=3] [ref=f6e169]
        - paragraph [ref=f6e170]: "PPO: any dentist, best savings in-network. DHMO: lower premium but you must use a network dentist. Dental savings plan: a discount membership ($100–$200/year), 10–60% off at participating dentists, with no waiting periods, deductibles, or annual maximums."
      - generic [ref=f6e171]:
        - heading "Are there waiting periods?" [level=3] [ref=f6e172]
        - paragraph [ref=f6e173]: Most standalone dental plans have a 6–12 month waiting period for major work (crowns, bridges, implants). Preventive care is usually covered immediately. If you need major work soon, a savings plan or no-waiting-period rider may fit better.
      - generic [ref=f6e174]:
        - heading "Does my Medicare Advantage plan cover dental and vision?" [level=3] [ref=f6e175]
        - paragraph [ref=f6e176]: Many Medicare Advantage plans include preventive dental and routine vision benefits, but limits vary widely. Original Medicare doesn't cover routine dental or vision. Check your plan documents first; if the dental allowance is too low, a standalone policy may still make sense.
      - generic [ref=f6e177]:
        - heading "What does it cost?" [level=3] [ref=f6e178]
        - paragraph [ref=f6e179]: Standalone adult dental commonly runs roughly $20–$60/month for an individual, depending on state, ZIP, carrier, and plan tier. Vision is usually $10–$20/month. Dental savings plans run $100–$200/year. Family plans cost more. The right plan depends on your expected work, dentist, and budget.
      - generic [ref=f6e180]:
        - heading "Do you charge a fee?" [level=3] [ref=f6e181]
        - paragraph [ref=f6e182]: No. David does not charge a client fee for dental and vision enrollment support. You can enroll yourself online and still contact David for customer service questions after enrollment.
      - generic [ref=f6e183]:
        - heading "Can kids get dental coverage through ACA?" [level=3] [ref=f6e184]
        - paragraph [ref=f6e185]: Yes. Pediatric dental is one of the ten Essential Health Benefits, so it is built into many Marketplace plan designs or sold as a stand-alone pediatric dental plan. Adult dental is usually separate and must be bought separately.
      - generic [ref=f6e186]:
        - heading "Can I enroll in dental or vision any time of year?" [level=3] [ref=f6e187]
        - paragraph [ref=f6e188]: Yes. Standalone dental and vision plans don't have an Open Enrollment window like ACA medical plans. You can enroll, change plans, or drop coverage any time, subject to the carrier's terms.
