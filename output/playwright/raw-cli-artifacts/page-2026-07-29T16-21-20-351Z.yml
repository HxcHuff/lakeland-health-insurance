  - main [ref=f6e43]:
    - generic [ref=f6e44]:
      - heading "Why adults often need standalone dental & vision" [level=2] [ref=f6e45]
      - paragraph [ref=f6e46]: "Adult dental and vision are usually sold separately from medical coverage. ACA Marketplace plans often handle pediatric dental differently than adult dental, and Original Medicare does not cover routine dental or vision. That leaves three common groups who usually need a standalone policy:"
      - generic [ref=f6e47]:
        - generic [ref=f6e48]:
          - heading "ACA enrollees" [level=3] [ref=f6e49]
          - paragraph [ref=f6e50]: Your kids may be covered, but you aren't. Standalone adult dental and vision fills that gap without changing your medical plan.
        - generic [ref=f6e51]:
          - heading "Original Medicare beneficiaries" [level=3] [ref=f6e52]
          - paragraph [ref=f6e53]: Medicare Parts A and B don't cover routine cleanings, fillings, dentures, or eyeglasses. A standalone dental + vision policy or a Medicare Advantage plan with built-in benefits fixes the gap.
        - generic [ref=f6e54]:
          - heading "Self-employed and uninsured" [level=3] [ref=f6e55]
          - paragraph [ref=f6e56]: Cash-paying for cleanings adds up fast. A $20–$60/month dental plan or a $100–$200/year dental savings membership is often cheaper than going without.
        - generic [ref=f6e57]:
          - heading "Families with planned dental work" [level=3] [ref=f6e58]
          - paragraph [ref=f6e59]: Crowns, root canals, implants, and orthodontia are expensive. A PPO dental plan with the right network and a survivable waiting period can offset thousands in out-of-pocket cost.
    - generic [ref=f6e60]:
      - heading "PPO dental vs DHMO vs dental savings plans" [level=2] [ref=f6e61]
      - paragraph [ref=f6e62]: "There is no single default dental option. Before you enroll, check your dentist, expected work, and tolerance for waiting periods. Here is how the three main options stack up:"
