    - generic [ref=f6e101]:
      - heading "How vision insurance usually works" [level=2] [ref=f6e102]
      - paragraph [ref=f6e103]: "Standalone adult vision insurance often runs $10–$20 per month and usually covers:"
      - generic [ref=f6e104]:
        - generic [ref=f6e105]:
          - heading "Annual eye exam" [level=3] [ref=f6e106]
          - paragraph [ref=f6e107]: One routine exam per year, usually with a small copay ($10–$25) at in-network providers.
        - generic [ref=f6e108]:
          - heading "Glasses or contacts allowance" [level=3] [ref=f6e109]
          - paragraph [ref=f6e110]: An annual allowance ($100–$200 typical) toward frames, lenses, or contact lenses. Lens upgrades like progressives, anti-glare, and photochromic add cost.
        - generic [ref=f6e111]:
          - heading "Discounts on the rest" [level=3] [ref=f6e112]
          - paragraph [ref=f6e113]: Once your allowance is used, plans usually give you 15–40% off additional eyewear, LASIK, and non-covered services.
      - paragraph [ref=f6e114]: If you only need an annual exam and a single pair of glasses, paying cash sometimes wins. If your household has multiple eyeglass-wearers or contact lens users, vision insurance usually pays for itself.
    - generic [ref=f6e115]:
      - heading "How self-enrollment works" [level=2] [ref=f6e116]
      - generic [ref=f6e117]:
        - generic [ref=f6e118]:
          - heading "Pick a quote link" [level=3] [ref=f6e119]
          - paragraph [ref=f6e120]: Use NCD when dental benefits are the priority. Use UnitedHealthcare when you want dental, vision, and supplemental options in one quote engine.
        - generic [ref=f6e121]:
          - heading "Enter your ZIP and household details" [level=3] [ref=f6e122]
          - paragraph [ref=f6e123]: Pricing, networks, and plan availability vary by state and ZIP code. Use the ZIP where coverage will be used.
        - generic [ref=f6e124]:
          - heading "Check the plan details" [level=3] [ref=f6e125]
          - paragraph [ref=f6e126]: Look at monthly premium, waiting periods, annual maximums, dentist network, and whether vision is included or separate.
        - generic [ref=f6e127]:
          - heading "Enroll yourself online" [level=3] [ref=f6e128]
          - paragraph [ref=f6e129]: After enrollment, David remains available for customer support questions about the policy, billing, cards, or next steps.
