  - generic [ref=f2e127]:
    - paragraph [ref=f2e128]: How I Work
    - heading "Direct, practical, and built around your real life." [level=2] [ref=f2e129]
    - generic [ref=f2e130]:
      - generic [ref=f2e131]:
        - heading "We start with your details" [level=3] [ref=f2e132]
        - paragraph [ref=f2e133]: Your doctors, prescriptions, household income, preferred hospitals, budget, and timeline matter more than a flashy premium. I use those details to narrow the options.
      - generic [ref=f2e134]:
        - heading "I explain the tradeoffs" [level=3] [ref=f2e135]
        - paragraph [ref=f2e136]: Every plan has tradeoffs. I help you understand networks, deductibles, copays, drug tiers, out-of-pocket exposure, referrals, and what those details mean day to day.
      - generic [ref=f2e137]:
        - heading "No pressure, no scripts" [level=3] [ref=f2e138]
        - paragraph [ref=f2e139]: You will not get a corporate sales routine. You get a real conversation, clear next steps, and enough context to make a decision with confidence.
      - generic [ref=f2e140]:
        - heading "I stay practical" [level=3] [ref=f2e141]
        - paragraph [ref=f2e142]: A lower premium or longer brochure does not automatically make coverage the better fit. The right review starts with your care, your risk, and your budget.
      - generic [ref=f2e143]:
        - heading "Local insight matters" [level=3] [ref=f2e144]
        - paragraph [ref=f2e145]: Lakeland and Polk County networks can be confusing. I pay attention to local systems like Watson Clinic, Lakeland Regional Health, BayCare, Orlando Health, and nearby provider access.
      - generic [ref=f2e146]:
        - heading "I help beyond one page" [level=3] [ref=f2e147]
        - paragraph [ref=f2e148]: Coverage questions do not always end after enrollment. When you need help understanding a card, comparing renewal options, or preparing for a plan change, you can reach out.
  - generic [ref=f2e150]:
    - paragraph [ref=f2e151]: Who I Serve
    - heading "Health insurance help for people who want a human guide." [level=2] [ref=f2e152]
    - paragraph [ref=f2e153]: Most clients come to me because they are tired of guessing. They want someone who can compare options, translate the fine print, and keep the conversation grounded.
    - generic [ref=f2e154]:
      - generic [ref=f2e155]:
