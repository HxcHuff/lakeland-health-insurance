  - generic [ref=f5e82]:
    - paragraph [ref=f5e83]: How I Work
    - heading "Direct, practical, and built around your real life." [level=2] [ref=f5e84]
    - generic [ref=f5e85]:
      - generic [ref=f5e86]:
        - heading "We start with your details" [level=3] [ref=f5e87]
        - paragraph [ref=f5e88]: Your doctors, prescriptions, household income, preferred hospitals, budget, and timeline matter more than a flashy premium. I use those details to narrow the options.
      - generic [ref=f5e89]:
        - heading "I explain the tradeoffs" [level=3] [ref=f5e90]
        - paragraph [ref=f5e91]: Every plan has tradeoffs. I help you understand networks, deductibles, copays, drug tiers, out-of-pocket exposure, referrals, and what those details mean day to day.
      - generic [ref=f5e92]:
        - heading "No pressure, no scripts" [level=3] [ref=f5e93]
        - paragraph [ref=f5e94]: You will not get a corporate sales routine. You get a real conversation, clear next steps, and enough context to make a decision with confidence.
      - generic [ref=f5e95]:
        - heading "I stay practical" [level=3] [ref=f5e96]
        - paragraph [ref=f5e97]: A lower premium or longer brochure does not automatically make coverage the better fit. The right review starts with your care, your risk, and your budget.
      - generic [ref=f5e98]:
        - heading "Local insight matters" [level=3] [ref=f5e99]
        - paragraph [ref=f5e100]: Lakeland and Polk County networks can be confusing. I pay attention to local systems like Watson Clinic, Lakeland Regional Health, BayCare, Orlando Health, and nearby provider access.
      - generic [ref=f5e101]:
        - heading "I help beyond one page" [level=3] [ref=f5e102]
        - paragraph [ref=f5e103]: Coverage questions do not always end after enrollment. When you need help understanding a card, comparing renewal options, or preparing for a plan change, you can reach out.
  - generic [ref=f5e105]:
    - paragraph [ref=f5e106]: Who I Serve
    - heading "Health insurance help for people who want a human guide." [level=2] [ref=f5e107]
    - paragraph [ref=f5e108]: Most clients come to me because they are tired of guessing. They want someone who can compare options, translate the fine print, and keep the conversation grounded.
    - generic [ref=f5e109]:
      - generic [ref=f5e110]:
