        - paragraph [ref=f5e112]: ACA Marketplace plans, private options, short-term coverage, dental, vision, and life insurance for families trying to protect both health and budget.
      - generic [ref=f5e113]:
        - heading "Medicare Beneficiaries" [level=3] [ref=f5e114]
        - paragraph [ref=f5e115]: Plan reviews for people turning 65, retiring, moving, losing employer coverage, or comparing Medicare Advantage, Medigap, and Part D options.
      - generic [ref=f5e116]:
        - heading "Self-Employed Workers" [level=3] [ref=f5e117]
        - paragraph [ref=f5e118]: Coverage guidance for freelancers, contractors, business owners, and people whose income or tax situation makes subsidies and plan selection more complicated.
