<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <title>Returning visitor feedback form registration</title>
</head>
<body>
  <!-- Netlify Forms registration only; UI is injected by welcome-back-popup.js -->
  <form name="returning-visitor-feedback" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="returning-visitor-feedback">
    <input type="text" name="brought_back">
    <input type="text" name="help_with">
    <input type="text" name="name">
    <input type="tel" name="phone">
    <input type="text" name="consent">
    <input type="hidden" name="source_tag" value="returning-visitor-feedback">
    <input type="text" name="visit_count">
    <input type="text" name="source_page">
    <input type="text" name="started_at">
    <input type="text" name="human_check">
    <input type="text" name="consent_text_version">
    <input type="text" name="bot-field">
  </form>
</body>
</html>
