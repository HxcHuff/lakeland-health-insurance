[build.processing.html]
  pretty_urls = false

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# deploy-succeeded.js is a Netlify event function. It pings IndexNow after a
# successful production deploy of lakelandhealthinsurance.com and fail-opens
# on every error so it cannot fail the deploy. No extra secrets required.

[functions."google-lead-crm-retry"]
  schedule = "*/15 * * * *"

# huffsherpa-relay-retry was removed. Do not reschedule it.
[functions."lead-bridge-retry"]
  schedule = "*/15 * * * *"

# Context-scoped env vars — server-side Meta CAPI only fires in production.
# Deploy previews and branch deploys are explicitly quiet so Events Manager
# stays clean and attribution windows aren't polluted by preview traffic.
[context.production.environment]
  LHI_SITE_ENV = "production"

[context.deploy-preview.environment]
  LHI_SITE_ENV = "preview"
  # Blank the CAPI token on previews as a defense-in-depth measure; the
  # legacy function also checks a build-context signal, but clearing the token
  # remains the build-side guarantee that previews cannot emit CAPI events.
  META_CAPI_ACCESS_TOKEN = ""

[context.branch-deploy.environment]
  LHI_SITE_ENV = "branch"
  META_CAPI_ACCESS_TOKEN = ""

# /api/lead -> serverless function (server-side CAPI + Netlify Forms forward)
# Kept in netlify.toml because Netlify Functions rewrites are more reliable
# when declared here than in _redirects.
[[redirects]]
  from = "/api/lead"
  to = "/.netlify/functions/lead"
  status = 200
  force = true

[[redirects]]
  from = "/api/calendly-schedule"
  to = "/.netlify/functions/calendly-schedule"
  status = 200
  force = true

[[redirects]]
  from = "/api/openai-ads-config"
  to = "/.netlify/functions/openai-ads-config"
  status = 200
  force = true

[[redirects]]
  from = "/api/google-lead-webhook"
  to = "/.netlify/functions/google-lead-webhook"
  status = 200
  force = true

[[redirects]]
  from = "/api/newsletter-confirm"
  to = "/.netlify/functions/newsletter-confirm"
  status = 200
  force = true

# NOTE: Page/blog redirects (PDF casing, non-.html → .html, /lp/ aliases,
# /find-plans, etc.) live in /_redirects as the single source of truth.
# Do not duplicate them here — Netlify processes _redirects first and
# duplicates cause drift.
