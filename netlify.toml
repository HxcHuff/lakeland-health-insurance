[build.processing.html]
  pretty_urls = false

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# /api/lead -> serverless function (Meta CAPI + Netlify Forms forward)
[[redirects]]
  from = "/api/lead"
  to = "/.netlify/functions/lead"
  status = 200
  force = true

# Redirect lowercase PDF URL to actual filename
[[redirects]]
  from = "/downloads/florida-health-insurance-survival-guide.pdf"
  to = "/downloads/Florida-Health-Insurance-Survival-Guide.pdf"
  status = 301
  force = true

# Redirect non-.html blog URLs to canonical .html versions
