<script>
  const posts = [
    {
      title: "5 Critical Health Insurance Mistakes That Could Cost You Thousands",
      date: "2025-06-10",
      excerpt: "Don't let these common health insurance blunders drain your bank account...",
      link: "/blog/5-critical-health-insurance-mistakes"
    },
    {
      title: "The Pre-Existing Condition Survival Guide",
      date: "2025-06-08",
      excerpt: "Navigate the complex world of pre-existing conditions with confidence...",
      link: "/blog/preexisting-condition-guide.html"
    },
    {
      title: "ACA vs Short-Term Plans: Which is Actually Right for You?",
      date: "2025-06-06",
      excerpt: "We’ll cut through the marketing fluff and give you the real pros and cons...",
      link: "/blog/aca-vs-short-term-plans.html"
    },
    {
      title: "How to Actually Use Your Health Insurance (Without Going Broke)",
      date: "2025-06-04",
      excerpt: "Having insurance is step one. Using it without triggering financial ruin...",
      link: "/blog/how-to-use-health-insurance-without-going-broke.html"
    },
    {
      title: "The Real Cost of Going Without Health Insurance",
      date: "2025-06-02",
      excerpt: "Think you're saving money by skipping insurance? We've crunched the numbers...",
      link: "/blog/real-cost-going-without-health-insurance.html"
    },
    {
      title: "Florida Health Insurance: Navigating the Sunshine State's Challenges",
      date: "2025-05-30",
      excerpt: "Florida has its own special insurance considerations. Here's what you need to know...",
      link: "/blog/florida-insurance-guide.html"
    },
    {
      title: "Dental Insurance: Worth It or Yacht Money?",
      date: "2025-05-28",
      excerpt: "The tooth about dental coverage. When it makes sense, when it doesn't...",
      link: "/blog/dental-insurance-guide.html"
    }
  ];

  let currentPage = 1;
  const postsPerPage = 3;

  function sortByDateDesc(a, b) {
    return new Date(b.date) - new Date(a.date);
  }

  function renderPosts() {
    const sortedPosts = posts.sort(sortByDateDesc);
    const start = (currentPage - 1) * postsPerPage;
    const end = start + postsPerPage;
    const paginatedPosts = sortedPosts.slice(start, end);
    const container = document.getElementById('blog-posts');
    container.innerHTML = '';

    paginatedPosts.forEach(post => {
      container.innerHTML += `
        <div class="article-card">
          <div class="article-title"><a href="${post.link}">${post.title}</a></div>
          <div class="article-date">${new Date(post.date).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })}</div>
          <div class="article-excerpt">${post.excerpt}</div>
        </div>`;
    });

    document.getElementById('prev-btn').disabled = currentPage === 1;
    document.getElementById('next-btn').disabled = end >= posts.length;
  }

  function changePage(direction) {
    currentPage += direction;
    renderPosts();
  }

  document.addEventListener('DOMContentLoaded', renderPosts);
</script>
