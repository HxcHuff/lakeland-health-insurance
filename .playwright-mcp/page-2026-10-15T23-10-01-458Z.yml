        - generic [ref=f1e235]:
          - heading "FAQ" [level=2] [ref=f1e236]
          - heading "Did Orlando Health buy Watson Clinic?" [level=3] [ref=f1e237]
          - paragraph [ref=f1e238]: No. Orlando Health's own FAQ says the relationship is not a merger or acquisition. It is described as an affiliation agreement and collaboration.
          - heading "Does the hospital opening mean Watson Clinic doctors only use Orlando Health?" [level=3] [ref=f1e239]
          - paragraph [ref=f1e240]: No. Orlando Health's Watson Clinic page says Watson Clinic physicians continue to provide care where their patients need care and continue to have privileges at other area hospitals.
          - heading "Should I rely on a provider directory?" [level=3] [ref=f1e241]
          - paragraph [ref=f1e242]: Use the directory as a starting point. For a high-stakes decision, verify the exact plan with the carrier and the provider office because directories can lag after network or facility changes.
          - heading "What insurance does Watson Clinic accept?" [level=3] [ref=f1e243]
          - paragraph [ref=f1e244]: "Watson Clinic publishes participation by plan type: Traditional Medicare, Medicare supplements, listed Medicare Advantage products, commercial payers, and Florida Blue Marketplace plans such as myBlue. Accepted at the clinic is not the same as in network for your exact plan ID. Confirm with Patient Relations and your plan directory."
          - heading "Does Watson Clinic accept Medicare Advantage plans?" [level=3] [ref=f1e245]
          - paragraph [ref=f1e246]: It depends on the plan year and plan ID. Check the Medicare Advantage network for doctors and for Orlando Health Watson Clinic Lakeland Highlands Hospital separately before you switch.
          - heading "Does Watson Clinic take Humana in 2027?" [level=3] [ref=f1e247]
