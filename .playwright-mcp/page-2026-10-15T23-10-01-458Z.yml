        - generic [ref=f1e107]:
          - heading "Is my Watson Clinic doctor in network for 2027?" [level=2] [ref=f1e108]
          - paragraph [ref=f1e109]: Search each doctor by name and office location in your plan’s 2027 provider directory, not just the Watson Clinic brand. Call the office with your plan name and ID, and note the date and representative. David Huff, a licensed Florida health agent, can help compare Marketplace or Medicare plan IDs against your Watson Clinic providers and prescriptions before you enroll. A review is not enrollment.
