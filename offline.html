<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Offline | Lakeland Health Insurance</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #1B2A4A 0%, #2563EB 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .container { max-width: 500px; }
        h1 { font-size: 2rem; font-weight: 800; margin-bottom: 1rem; }
        p { font-size: 1.1rem; opacity: 0.9; margin-bottom: 1.5rem; line-height: 1.6; }
        .phone-link {
            display: inline-block;
            background: white;
            color: #1B2A4A;
            padding: 16px 32px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.2rem;
            text-decoration: none;
            transition: transform 0.3s ease;
        }
        .phone-link:hover { transform: translateY(-3px); }
        .subtitle {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>You're Offline</h1>
        <p>No worries — you can still reach David directly. He answers personally.</p>
        <a href="tel:+18636403102" class="phone-link">Call (863) 640-3102</a>
        <p class="subtitle">Lakeland Health Insurance<br>Mon-Fri 8AM-8PM | Sat 9AM-5PM EST</p>
    </div>
</body>
</html>
