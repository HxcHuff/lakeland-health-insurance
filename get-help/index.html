<style>
    :root {
      --bg: #111118;
      --card: #1a1a28;
      --panel: #222233;
      --line: #2a2a3a;
      --ink: #e8e8ec;
      --muted: #888;
      --muted-2: #666;
      --gold: #c8a45e;
      --gold-soft: rgba(200, 164, 94, 0.15);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      font-family: 'Libre Franklin', sans-serif;
      padding: 24px;
      color: var(--ink);
    }

    .wrap {
      min-height: calc(100vh - 48px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: var(--card);
      border-radius: 24px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 8px 40px rgba(0,0,0,0.4);
      overflow: hidden;
    }

    .head {
      padding: 28px 28px 20px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--gold);
      color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
    }

    .name { font-size: 15px; font-weight: 600; }
    .brand { color: var(--muted-2); font-size: 12px; }

    .chat {
      padding: 24px 28px;
      max-height: 460px;
      min-height: 300px;
      overflow-y: auto;
    }

    .q-wrap { display: flex; justify-content: flex-start; margin-bottom: 12px; }

    .q {
      background: #2a2a3a;
      color: var(--ink);
      padding: 14px 20px;
      border-radius: 18px 18px 18px 4px;
      font-size: 16px;
      font-weight: 500;
      max-width: 380px;
      line-height: 1.5;
    }

    .q-sub { font-size: 12px; color: #777; margin-top: 4px; margin-left: 8px; }

    .a-wrap { display: flex; justify-content: flex-end; margin-bottom: 8px; }

    .a {
      background: var(--gold);
      color: #1a1a1a;
      padding: 10px 18px;
      border-radius: 18px 18px 4px 18px;
      font-size: 15px;
      font-weight: 500;
      max-width: 80%;
      line-height: 1.35;
      word-break: break-word;
    }

    .opts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-bottom: 8px; }

    .opt {
      padding: 10px 18px;
      border-radius: 20px;
      border: 1.5px solid #3a3a4a;
      background: transparent;
      color: #ccc;
      font-size: 14px;
      cursor: pointer;
      transition: all .15s ease;
      font-family: 'Libre Franklin', sans-serif;
    }

    .opt:hover { border-color: var(--gold); color: var(--gold); }
    .opt.active { border-color: var(--gold); color: var(--gold); background: var(--gold-soft); }

    .mini-btn {
      padding: 8px 20px;
      border-radius: 20px;
      border: none;
      background: var(--gold);
      color: #1a1a1a;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Libre Franklin', sans-serif;
    }

    .text-row { display: flex; gap: 8px; justify-content: flex-end; margin-bottom: 8px; }

    .text-input {
      padding: 10px 16px;
      border-radius: 20px;
      border: 1.5px solid #3a3a4a;
      background: transparent;
      color: var(--ink);
      font-size: 14px;
      width: 120px;
      outline: none;
      font-family: 'Libre Franklin', sans-serif;
    }

    .send {
      padding: 10px 16px;
      border-radius: 20px;
      border: none;
      background: var(--gold);
      color: #1a1a1a;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Libre Franklin', sans-serif;
    }

    .contact {
      background: var(--panel);
      border-radius: 16px;
      padding: 24px;
      margin-top: 8px;
    }

    .field { margin-bottom: 14px; }

    .field label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .field input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1.5px solid #3a3a4a;
      background: #1a1a2a;
      color: var(--ink);
      font-size: 14px;
      font-family: 'Libre Franklin', sans-serif;
      outline: none;
    }

    .consent { display: flex; align-items: flex-start; gap: 10px; margin-top: 8px; }
    .consent input { margin-top: 2px; accent-color: var(--gold); }
    .consent span { font-size: 12px; color: #777; line-height: 1.5; }

    .submit {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Libre Franklin', sans-serif;
      transition: all .15s ease;
    }

    .submit.enabled { background: var(--gold); color: #1a1a1a; cursor: pointer; }
    .submit.disabled { background: #3a3a4a; color: #666; cursor: not-allowed; }

    .foot {
      padding: 12px 28px 16px;
      border-top: 1px solid var(--line);
      text-align: center;
      font-size: 12px;
      color: #555;
    }

    .foot a { color: var(--gold); text-decoration: none; }

    .done {
      text-align: center;
      padding: 60px 20px;
    }

    .done h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px;
      color: var(--ink);
      margin: 0 0 12px;
      font-weight: 700;
    }

    .done p {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
      margin: 0;
    }

    .done-call {
      margin-top: 32px;
      padding: 14px 24px;
      background: #2a2a3a;
      border-radius: 12px;
      display: inline-block;
      font-size: 14px;
      color: var(--muted);
    }

    .done-call a { color: var(--gold); text-decoration: none; font-weight: 600; }

    @media (max-width: 640px) {
      body { padding: 12px; }
      .wrap { min-height: auto; }
      .head { padding: 18px 18px 16px; }
      .chat { padding: 18px; max-height: 60vh; }
      .foot { padding: 12px 18px 16px; }
      .q { max-width: 88vw; }
    }
  </style>

  <script>
    (function() {
      var QUESTIONS = [
        {
          id: 'coverageType',
          question: 'What kind of coverage are you looking for?',
          type: 'single',
          options: [
            'ACA / Marketplace',
            'Medicare',
            'Short-Term / Gap',
            'Supplemental / fixed indemnity',
            'Dental & Vision',
            'Not sure - help me figure it out'
          ]
        },
        {
          id: 'householdSize',
          question: 'Who needs coverage?',
          type: 'single',
          options: ['Just me', 'Me + spouse', 'Me + child(ren)', 'Family (3+)']
        },
        {
          id: 'status',
          question: "What's your current situation?",
          type: 'single',
          options: [
            'Currently uninsured',
            'Have coverage, want to switch',
            'Losing coverage soon',
            'New to Medicare / turning 65',
            'Just moved to Florida'
          ]
        },
        {
          id: 'timing',
          question: 'How soon do you need coverage?',
          type: 'single',
          options: ['ASAP', 'Within 30 days', 'Next open enrollment', 'Just exploring']
        },
        {
          id: 'concerns',
          question: 'What matters most to you?',
          subtitle: 'Pick all that apply',
          type: 'multi',
          options: ['Lower premiums', 'Keep my doctors', 'Rx coverage', 'Low deductibles', 'Understanding my options']
        },
        {
          id: 'zip',
          question: "What's your ZIP code?",
          type: 'text',
          placeholder: '33801'
        },
        {
          id: 'leadSource',
          question: 'Last one — how did you find me?',
          type: 'single',
          options: [
            'ChatGPT / AI assistant',
            'Google search',
            'Facebook',
            'Referral from someone',
            'Saw an ad',
            'Other'
          ]
        }
      ];

      var answers = {};
      var currentQ = 0;
      var showContact = false;
      var textInput = '';
      var startedAt = String(Date.now());
      var humanCheck = btoa(startedAt + ':lakeland-human');
      var params = new URLSearchParams(window.location.search);
      var productInterest = params.get('product') || '';
      var planInterest = params.get('plan') || '';

      var contact = { name: '', phone: '', email: '', consent: false };

      var chat = document.getElementById('chat');
      var form = document.getElementById('leadForm');
      var activeState = document.getElementById('activeState');
      var doneState = document.getElementById('doneState');
      document.getElementById('startedAtInput').value = startedAt;
      document.getElementById('humanCheckInput').value = humanCheck;
      document.getElementById('productInterestInput').value = productInterest;
      document.getElementById('planInterestInput').value = planInterest;
      document.getElementById('sourcePageInput').value = window.location.pathname + window.location.search;
      document.getElementById('referralPageInput').value = document.referrer || '';

      if (productInterest === 'hpg') {
        answers.coverageType = 'Supplemental / fixed indemnity';
      }

      function scrollToBottom() {
        chat.scrollTop = chat.scrollHeight;
      }

      function qBubble(text, subtitle) {
        var wrap = document.createElement('div');
        wrap.className = 'q-wrap';

        var holder = document.createElement('div');

        var q = document.createElement('div');
        q.className = 'q';
        q.textContent = text;
        holder.appendChild(q);

        if (subtitle) {
          var sub = document.createElement('div');
          sub.className = 'q-sub';
          sub.textContent = subtitle;
          holder.appendChild(sub);
        }

        wrap.appendChild(holder);
        return wrap;
      }

      function aBubble(text) {
        var wrap = document.createElement('div');
        wrap.className = 'a-wrap';

        var a = document.createElement('div');
        a.className = 'a';
        a.textContent = text;

        wrap.appendChild(a);
        return wrap;
      }

      function syncHiddenFields() {
        document.getElementById('coverageInput').value = answers.coverageType || '';
        document.getElementById('householdInput').value = answers.householdSize || '';
        document.getElementById('statusInput').value = answers.status || '';
        document.getElementById('timingInput').value = answers.timing || '';
        document.getElementById('concernsInput').value = (answers.concerns || []).join(', ');
        document.getElementById('zipInput').value = answers.zip || '';
        document.getElementById('leadSourceInput').value = answers.leadSource || '';
      }

      function validateZip(zip) {
        return /^\d{5}$/.test(zip);
      }

      function renderOptions(q) {
        if (q.type === 'single') {
          var row = document.createElement('div');
          row.className = 'opts';
          q.options.forEach(function(opt) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'opt';
            btn.textContent = opt;
            btn.addEventListener('click', function() {
              answers[q.id] = opt;
              syncHiddenFields();
              if (currentQ === 0 && typeof gtag === 'function') gtag('event', 'lead_step_1_complete');
              currentQ += 1;
              render();
            });
            row.appendChild(btn);
          });
          return row;
        }

        if (q.type === 'multi') {
          var holder = document.createElement('div');
          var row = document.createElement('div');
          row.className = 'opts';

          if (!answers[q.id]) answers[q.id] = [];

          q.options.forEach(function(opt) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'opt' + (answers[q.id].indexOf(opt) >= 0 ? ' active' : '');
            btn.textContent = opt;
            btn.addEventListener('click', function() {
              var idx = answers[q.id].indexOf(opt);
              if (idx >= 0) answers[q.id].splice(idx, 1);
              else answers[q.id].push(opt);
              syncHiddenFields();
              render();
            });
            row.appendChild(btn);
          });

          holder.appendChild(row);

          if ((answers[q.id] || []).length > 0) {
            var action = document.createElement('div');
            action.style.display = 'flex';
            action.style.justifyContent = 'flex-end';
            action.style.marginTop = '10px';

            var next = document.createElement('button');
            next.type = 'button';
            next.className = 'mini-btn';
            next.textContent = 'Continue →';
            next.addEventListener('click', function() {
              syncHiddenFields();
              currentQ += 1;
              render();
            });

            action.appendChild(next);
            holder.appendChild(action);
          }

          return holder;
        }

        if (q.type === 'text') {
          var row = document.createElement('div');
          row.className = 'text-row';

          var input = document.createElement('input');
          input.type = 'text';
          input.className = 'text-input';
          input.placeholder = q.placeholder || '';
          input.value = textInput;
          input.autofocus = true;
          input.addEventListener('input', function(e) { textInput = e.target.value; });
          input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
              e.preventDefault();
              submitText(q.id);
            }
          });

          var send = document.createElement('button');
          send.type = 'button';
          send.className = 'send';
          send.textContent = '→';
          send.addEventListener('click', function() { submitText(q.id); });

          row.appendChild(input);
          row.appendChild(send);
          return row;
        }

        return document.createElement('div');
      }

      function submitText(id) {
        var val = String(textInput || '').trim();
        if (!val) return;
        if (id === 'zip' && !validateZip(val)) {
          alert('Please enter a valid 5-digit ZIP code.');
          return;
        }
        answers[id] = val;
        textInput = '';
        syncHiddenFields();
        currentQ += 1;
        if (typeof gtag === 'function') gtag('event', 'lead_step_2_complete');
        render();
      }

      function contactBlock() {
        var block = document.createElement('div');

        block.appendChild(aBubble(answers.leadSource || ''));
        block.appendChild(qBubble('Perfect. Last step - how should I reach you?'));

        var c = document.createElement('div');
        c.className = 'contact';

        function field(label, key, type, placeholder) {
          var w = document.createElement('div');
          w.className = 'field';

          var l = document.createElement('label');
          l.textContent = label + ' *';

          var i = document.createElement('input');
          i.type = type;
          i.placeholder = placeholder;
          i.value = contact[key];
          i.addEventListener('input', function(e) { contact[key] = e.target.value; refreshSubmit(); });

          w.appendChild(l);
          w.appendChild(i);
          return w;
        }

        c.appendChild(field('Full Name', 'name', 'text', 'John Smith'));
        c.appendChild(field('Phone', 'phone', 'tel', '(863) 555-1234'));
        c.appendChild(field('Email', 'email', 'email', 'john@example.com'));

        var consent = document.createElement('label');
        consent.className = 'consent';

        var chk = document.createElement('input');
        chk.type = 'checkbox';
        chk.checked = !!contact.consent;
        chk.addEventListener('change', function(e) { contact.consent = e.target.checked; refreshSubmit(); });

        var cText = document.createElement('span');
        cText.innerHTML = 'By checking this box, I agree to receive SMS messages from Lakeland Health Insurance about insurance plans, enrollment, appointments, and account updates at the phone number provided. Consent is not a condition of purchase. Message frequency varies. Msg &amp; data rates may apply. Reply HELP for help, STOP to cancel. See our <a href="/privacy-policy.html" target="_blank" rel="noopener" style="color: var(--gold); text-decoration: underline;">Privacy Policy</a> and <a href="/sms-policy.html" target="_blank" rel="noopener" style="color: var(--gold); text-decoration: underline;">SMS Terms</a>.';

        consent.appendChild(chk);
        consent.appendChild(cText);
        c.appendChild(consent);

        var submit = document.createElement('button');
        submit.type = 'button';
        submit.className = 'submit';
        submit.id = 'submitBtn';
        submit.textContent = 'Send My Request';
        submit.addEventListener('click', submitLead);
        c.appendChild(submit);

        block.appendChild(c);

        function refreshSubmit() {
          var ok = !!(contact.name.trim() && contact.phone.trim() && contact.email.trim() && contact.consent);
          submit.classList.toggle('enabled', ok);
          submit.classList.toggle('disabled', !ok);
          submit.disabled = !ok;
        }

        refreshSubmit();
        return block;
      }

      function submitLead() {
        if (!(contact.name.trim() && contact.phone.trim() && contact.email.trim() && contact.consent)) return;
        if (Date.now() - Number(startedAt) < 5000) {
          alert('Please wait a moment, then send your request.');
          return;
        }

        document.getElementById('fullNameInput').value = contact.name;
        document.getElementById('phoneInput').value = contact.phone;
        document.getElementById('emailInput').value = contact.email;
        document.getElementById('consentInput').value = 'yes';

        /* Push identity first so funnel.js can hash email/phone and set them
           as Meta Advanced Matching BEFORE the Lead event fires. */
        if (window.LHI && typeof window.LHI.identify === 'function') {
          window.LHI.identify({
            email: contact.email,
            phone: contact.phone,
            name:  contact.name,
            zip:   answers && answers.zip ? answers.zip : null
          });
        }

        /* Fire Lead event FIRST, then submit form after pixel has time to send.
           Previous bug: fetch() resolved in ~20ms and redirected to /thanks.html
           before the 50ms setTimeout fired — killing the fbq beacon mid-flight.
           Fix: fire pixel synchronously, wait 300ms for beacon to complete,
           THEN submit form and redirect. 300ms is imperceptible to the user
           but gives fbq + GA4 + Supabase time to send. */
        if (window.LHI && typeof window.LHI.track === 'function') {
          window.LHI.track('Lead', {
            content_name: 'get_help_form_conversational',
            line_of_business: answers && answers.coverageType ? answers.coverageType : null
          });
        } else {
          /* Fallback if funnel.js failed to load — keep raw fires so we
             never lose a lead. */
          if (typeof gtag === 'function') gtag('event', 'lead_submit');
          if (typeof fbq === 'function') fbq('track', 'Lead', { content_name: 'get_help_form_conversational' });
        }

        /* Delay form POST so pixel beacons complete before page navigates. */
        var formData = new FormData(form);
        var payload = {};
        formData.forEach(function(value, key) {
          payload[key] = value;
        });
        payload.source_url = window.location.href;
        payload.content_name = 'get_help_form_conversational';

        setTimeout(function () {
          fetch('/api/lead', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          }).then(function(response) {
            if (!response.ok) throw new Error('Lead submission blocked');
            window.location.href = '/thanks.html';
          }).catch(function(error) {
            if (error && error.message === 'Lead submission blocked') {
              alert('Please wait a moment, then send your request again.');
              return;
            }
            form.submit();
          });
        }, 300);
      }

      function render() {
        syncHiddenFields();
        chat.innerHTML = '';

        chat.appendChild(qBubble("Hey - let's find you the right plan. I've got a few quick questions."));

        for (var i = 0; i <= currentQ && i < QUESTIONS.length; i += 1) {
          var q = QUESTIONS[i];
          var answer = answers[q.id];
          var isCurrent = i === currentQ;

          if (i > 0) chat.appendChild(qBubble(q.question, q.subtitle));

          if (answer && !isCurrent) {
            chat.appendChild(aBubble(Array.isArray(answer) ? answer.join(', ') : answer));
          }

          if (isCurrent) {
            chat.appendChild(renderOptions(q));
          }
        }

        if (currentQ >= QUESTIONS.length && !showContact) {
          showContact = true;
        }

        if (showContact) {
          chat.appendChild(contactBlock());
        }

        scrollToBottom();
      }

      render();
    })();
  </script>
</body>
</html>
