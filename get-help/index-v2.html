<style>
    :root {
      --bg: #111118;
      --card: #1a1a28;
      --panel: #222233;
      --line: #2a2a3a;
      --ink: #e8e8ec;
      --muted: #888;
      --muted-2: #666;
      --gold: #c8a45e;
      --gold-soft: rgba(200, 164, 94, 0.15);
      --success: #4CAF50;
      --error: #e53935;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--bg);
      font-family: 'DM Sans', 'Libre Franklin', sans-serif;
      color: var(--ink);
    }

    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .card {
      background: var(--card);
      border-radius: 24px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 8px 40px rgba(0,0,0,0.4);
      overflow: hidden;
    }

    /* ── HEADER WITH TRUST SIGNALS ── */
    .head {
      padding: 24px 24px 16px;
      border-bottom: 1px solid var(--line);
    }

    .head-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--gold);
      color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
      flex-shrink: 0;
    }

    .name { font-size: 15px; font-weight: 600; }
    .brand { color: var(--muted-2); font-size: 12px; }

    .trust-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      padding: 8px 0 0;
    }

    .trust-badge {
      font-size: 11px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .trust-badge svg { width: 14px; height: 14px; fill: var(--gold); flex-shrink: 0; }

    /* ── PROGRESS BAR ── */
    .progress-wrap {
      padding: 0 24px;
      margin: 12px 0 0;
    }

    .progress-bar {
      height: 3px;
      background: var(--line);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--gold);
      border-radius: 3px;
      transition: width 0.4s ease;
    }

    .progress-label {
      font-size: 11px;
      color: var(--muted-2);
      margin-top: 6px;
      text-align: right;
    }

    /* ── CHAT AREA ── */
    .chat {
      padding: 20px 24px;
      min-height: 280px;
      max-height: 420px;
      overflow-y: auto;
    }

    .q-wrap { display: flex; justify-content: flex-start; margin-bottom: 12px; }

    .q {
      background: #2a2a3a;
      color: var(--ink);
      padding: 14px 18px;
      border-radius: 18px 18px 18px 4px;
      font-size: 15px;
      font-weight: 500;
      max-width: 360px;
      line-height: 1.5;
    }

    .a-wrap { display: flex; justify-content: flex-end; margin-bottom: 8px; }

    .a {
      background: var(--gold);
      color: #1a1a1a;
      padding: 10px 16px;
      border-radius: 18px 18px 4px 18px;
      font-size: 14px;
      font-weight: 500;
      max-width: 80%;
      line-height: 1.35;
    }

    /* ── OPTIONS ── */
    .opts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-bottom: 8px; }

    .opt {
      padding: 10px 16px;
      border-radius: 20px;
      border: 1.5px solid #3a3a4a;
      background: transparent;
      color: #ccc;
      font-size: 13px;
      cursor: pointer;
      transition: all .15s ease;
      font-family: inherit;
    }

    .opt:hover { border-color: var(--gold); color: var(--gold); }

    /* ── BACK BUTTON ── */
    .nav-row {
      display: flex;
      justify-content: flex-start;
      margin-top: 8px;
    }

    .back-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      padding: 4px 8px;
      border-radius: 8px;
      transition: color 0.15s;
    }

    .back-btn:hover { color: var(--gold); }

    /* ── CONTACT FORM ── */
    .contact {
      background: var(--panel);
      border-radius: 16px;
      padding: 20px;
      margin-top: 8px;
    }

    .field { margin-bottom: 12px; }

    .field label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .field input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1.5px solid #3a3a4a;
      background: #1a1a2a;
      color: var(--ink);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .field input:focus { border-color: var(--gold); }
    .field input.error { border-color: var(--error); }

    .field-error {
      font-size: 11px;
      color: var(--error);
      margin-top: 3px;
      display: none;
    }

    .field-error.show { display: block; }

    .consent-wrap { display: flex; align-items: flex-start; gap: 10px; margin-top: 12px; }
    .consent-wrap input[type="checkbox"] { margin-top: 2px; accent-color: var(--gold); flex-shrink: 0; }
    .consent-wrap span { font-size: 11px; color: #777; line-height: 1.4; }

    .consent-note {
      font-size: 11px;
      color: var(--muted-2);
      margin-top: 8px;
      font-style: italic;
    }

    .submit {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      background: var(--gold);
      color: #1a1a1a;
      cursor: pointer;
      transition: opacity .15s ease;
    }

    .submit:disabled { opacity: 0.4; cursor: not-allowed; }

    .submit-sub {
      text-align: center;
      font-size: 11px;
      color: var(--muted-2);
      margin-top: 8px;
    }

    /* ── FOOTER ── */
    .foot {
      padding: 12px 24px 16px;
      border-top: 1px solid var(--line);
      text-align: center;
      font-size: 12px;
      color: #555;
    }

    .foot a { color: var(--gold); text-decoration: none; font-weight: 600; }

    .call-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #2a2a3a;
      padding: 8px 16px;
      border-radius: 20px;
      color: var(--gold);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      margin-top: 4px;
      transition: background 0.15s;
    }

    .call-btn:hover { background: #333344; }

    /* ── DONE STATE ── */
    .done { text-align: center; padding: 60px 24px; display: none; }

    .done h2 {
      font-family: 'Instrument Serif', serif;
      font-size: 28px;
      color: var(--ink);
      margin: 0 0 12px;
      font-weight: 700;
    }

    .done p { color: var(--muted); font-size: 15px; line-height: 1.6; }

    .done-call {
      margin-top: 24px;
      padding: 14px 20px;
      background: #2a2a3a;
      border-radius: 12px;
      display: inline-block;
      font-size: 14px;
      color: var(--muted);
    }

    .done-call a { color: var(--gold); text-decoration: none; font-weight: 600; }

    @media (max-width: 640px) {
      .wrap { padding: 8px; }
      .head { padding: 18px 18px 14px; }
      .chat { padding: 16px 18px; max-height: 55vh; }
      .foot { padding: 10px 18px 14px; }
      .trust-row { gap: 10px; }
    }
  </style>
  <script defer src="/js/analytics.js"></script>
</head>

  <script>
    (function() {
      /* ─── REDUCED TO 3 STEPS ─── */
      var STEPS = [
        {
          id: 'coverageType',
          question: "What kind of coverage are you looking for?",
          type: 'single',
          options: [
            'ACA / Marketplace',
            'Medicare',
            'Short-Term / Gap',
            'Dental & Vision',
            'Not sure yet'
          ]
        },
        {
          id: 'status',
          question: "What's your current situation?",
          type: 'single',
          options: [
            'Currently uninsured',
            'Have coverage, want to switch',
            'Losing coverage soon',
            'Turning 65 / Medicare eligible',
            'Just moved to Florida'
          ]
        },
        {
          id: 'contact',
          question: "Almost done — where should I reach you?",
          type: 'contact'
        }
      ];

      var answers = {};
      var currentStep = 0;
      var contact = { name: '', phone: '', email: '', zip: '', consent: false };

      var chat = document.getElementById('chat');
      var form = document.getElementById('leadForm');
      var progressFill = document.getElementById('progressFill');
      var progressLabel = document.getElementById('progressLabel');

      /* ─── UTM CAPTURE ─── */
      function captureLeadSource() {
        var params = new URLSearchParams(window.location.search);
        var src = params.get('utm_source') || '';
        var med = params.get('utm_medium') || '';
        var camp = params.get('utm_campaign') || '';
        if (src) return src + ' / ' + med + (camp ? ' / ' + camp : '');
        if (document.referrer) {
          try {
            var ref = new URL(document.referrer).hostname;
            if (ref.includes('facebook')) return 'facebook / organic';
            if (ref.includes('google')) return 'google / organic';
            if (ref.includes('bing')) return 'bing / organic';
            return ref + ' / referral';
          } catch(e) {}
        }
        return 'direct';
      }
      document.getElementById('leadSourceInput').value = captureLeadSource();

      function scrollToBottom() { chat.scrollTop = chat.scrollHeight; }

      function updateProgress() {
        var pct = Math.round(((currentStep) / STEPS.length) * 100);
        progressFill.style.width = pct + '%';
        progressLabel.textContent = 'Step ' + Math.min(currentStep + 1, STEPS.length) + ' of ' + STEPS.length;
      }

      function qBubble(text) {
        var wrap = document.createElement('div');
        wrap.className = 'q-wrap';
        var q = document.createElement('div');
        q.className = 'q';
        q.textContent = text;
        wrap.appendChild(q);
        return wrap;
      }

      function aBubble(text) {
        var wrap = document.createElement('div');
        wrap.className = 'a-wrap';
        var a = document.createElement('div');
        a.className = 'a';
        a.textContent = text;
        wrap.appendChild(a);
        return wrap;
      }

      function backButton() {
        if (currentStep === 0) return document.createElement('div');
        var row = document.createElement('div');
        row.className = 'nav-row';
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'back-btn';
        btn.innerHTML = '&larr; Back';
        btn.addEventListener('click', function() {
          currentStep--;
          render();
        });
        row.appendChild(btn);
        return row;
      }

      function renderOptions(step) {
        var row = document.createElement('div');
        row.className = 'opts';
        step.options.forEach(function(opt) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'opt';
          btn.textContent = opt;
          btn.addEventListener('click', function() {
            answers[step.id] = opt;
            currentStep++;
            render();
          });
          row.appendChild(btn);
        });
        return row;
      }

      function validateEmail(email) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email); }
      function validatePhone(phone) { return phone.replace(/\D/g, '').length >= 10; }
      function validateZip(zip) { return /^\d{5}$/.test(zip); }

      function renderContactForm() {
        var block = document.createElement('div');
        var c = document.createElement('div');
        c.className = 'contact';

        function makeField(label, key, type, placeholder, required) {
          var w = document.createElement('div');
          w.className = 'field';
          var l = document.createElement('label');
          l.textContent = label + (required ? ' *' : '');
          var i = document.createElement('input');
          i.type = type;
          i.placeholder = placeholder;
          i.value = contact[key] || '';
          i.autocomplete = key === 'name' ? 'name' : key === 'phone' ? 'tel' : key === 'email' ? 'email' : 'postal-code';
          i.addEventListener('input', function(e) {
            contact[key] = e.target.value;
            e.target.classList.remove('error');
            var errEl = w.querySelector('.field-error');
            if (errEl) errEl.classList.remove('show');
          });
          var err = document.createElement('div');
          err.className = 'field-error';
          err.dataset.field = key;
          w.appendChild(l);
          w.appendChild(i);
          w.appendChild(err);
          return w;
        }

        c.appendChild(makeField('Full Name', 'name', 'text', 'John Smith', true));
        c.appendChild(makeField('Phone', 'phone', 'tel', '(863) 555-1234', true));
        c.appendChild(makeField('Email', 'email', 'email', 'john@example.com', true));
        c.appendChild(makeField('ZIP Code', 'zip', 'text', '33801', false));

        /* SMS consent — optional, not a gate */
        var consentWrap = document.createElement('label');
        consentWrap.className = 'consent-wrap';
        var chk = document.createElement('input');
        chk.type = 'checkbox';
        chk.checked = !!contact.consent;
        chk.addEventListener('change', function(e) { contact.consent = e.target.checked; });
        var cText = document.createElement('span');
        cText.innerHTML = 'By checking this box, I agree to receive SMS messages from Lakeland Health Insurance about insurance plans, enrollment, appointments, and account updates at the phone number provided. Consent is not a condition of purchase. Message frequency varies. Msg &amp; data rates may apply. Reply HELP for help, STOP to cancel. See our <a href="/privacy-policy.html" target="_blank" rel="noopener" style="color: var(--gold); text-decoration: underline;">Privacy Policy</a> and <a href="/sms-policy.html" target="_blank" rel="noopener" style="color: var(--gold); text-decoration: underline;">SMS Terms</a>.';
        consentWrap.appendChild(chk);
        consentWrap.appendChild(cText);
        c.appendChild(consentWrap);

        var submit = document.createElement('button');
        submit.type = 'button';
        submit.className = 'submit';
        submit.textContent = 'Get My Free Quote';
        submit.addEventListener('click', function() { validateAndSubmit(c); });
        c.appendChild(submit);

        var subNote = document.createElement('div');
        subNote.className = 'submit-sub';
        subNote.textContent = 'No cost to you — brokers are paid by insurance carriers.';
        c.appendChild(subNote);

        block.appendChild(c);
        return block;
      }

      function validateAndSubmit(container) {
        var valid = true;
        var fields = [
          { key: 'name', msg: 'Please enter your name', validate: function(v) { return v.trim().length > 0; } },
          { key: 'phone', msg: 'Please enter a valid phone number', validate: validatePhone },
          { key: 'email', msg: 'Please enter a valid email', validate: validateEmail }
        ];

        fields.forEach(function(f) {
          var errEl = container.querySelector('[data-field="' + f.key + '"]');
          var input = errEl ? errEl.previousElementSibling : null;
          if (!f.validate(contact[f.key] || '')) {
            valid = false;
            if (errEl) { errEl.textContent = f.msg; errEl.classList.add('show'); }
            if (input) input.classList.add('error');
          }
        });

        /* ZIP is optional but validate if provided */
        if (contact.zip && !validateZip(contact.zip)) {
          valid = false;
          var zipErr = container.querySelector('[data-field="zip"]');
          if (zipErr) { zipErr.textContent = 'Enter a valid 5-digit ZIP'; zipErr.classList.add('show'); }
        }

        if (!valid) return;

        /* Sync hidden fields */
        document.getElementById('coverageInput').value = answers.coverageType || '';
        document.getElementById('statusInput').value = answers.status || '';
        document.getElementById('fullNameInput').value = contact.name;
        document.getElementById('phoneInput').value = contact.phone;
        document.getElementById('emailInput').value = contact.email;
        document.getElementById('zipInput').value = contact.zip || '';
        document.getElementById('consentInput').value = contact.consent ? 'yes' : 'no';

        /* ─── FIRE LEAD EVENT ONLY ON ACTUAL SUBMISSION ─── */
        if (window.LHI && typeof window.LHI.identify === 'function') {
          window.LHI.identify({
            email: contact.email,
            phone: contact.phone,
            name: contact.name,
            zip: contact.zip || null
          });
        }

        if (window.LHI && typeof window.LHI.track === 'function') {
          setTimeout(function() {
            window.LHI.track('Lead', {
              content_name: 'get_help_form_v2',
              line_of_business: answers.coverageType || null
            });
          }, 50);
        } else {
          if (typeof gtag === 'function') gtag('event', 'generate_lead', { event_category: 'form', event_label: 'get_help_v2' });
          if (typeof fbq === 'function') fbq('track', 'Lead', { content_name: 'get_help_form_v2' });
        }

        /* Submit to Netlify */
        var formData = new FormData(form);
        fetch('/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams(formData).toString()
        }).then(function() {
          window.location.href = '/thanks.html';
        }).catch(function() {
          form.submit();
        });
      }

      function render() {
        chat.innerHTML = '';
        updateProgress();

        chat.appendChild(qBubble("Hey — I'll match you with the right plan. Just 3 quick questions."));

        for (var i = 0; i < STEPS.length; i++) {
          var step = STEPS[i];
          var answer = answers[step.id];
          var isCurrent = i === currentStep;

          if (i > 0 && i <= currentStep) {
            chat.appendChild(qBubble(step.question));
          }

          if (answer && !isCurrent && step.type !== 'contact') {
            chat.appendChild(aBubble(answer));
          }

          if (isCurrent) {
            if (step.type === 'single') {
              chat.appendChild(renderOptions(step));
            } else if (step.type === 'contact') {
              chat.appendChild(qBubble(step.question));
              chat.appendChild(renderContactForm());
            }
            chat.appendChild(backButton());
            break;
          }
        }

        scrollToBottom();
      }

      render();
    })();
  </script>
</body>
</html>
