    const { useState, useEffect, useRef } = React;

    // 2025 FPL (used for 2026 coverage) - 48 contiguous states
    const FPL_BASE = 15650;
    const FPL_INCREMENT = 5500;

    // 2026 Applicable Percentages from IRS Rev. Proc. 2025-25
    const APPLICABLE_PERCENTAGES = [
      { min: 1.00, max: 1.33, initialPct: 0.021, finalPct: 0.021 },
      { min: 1.33, max: 1.50, initialPct: 0.0314, finalPct: 0.0419 },
      { min: 1.50, max: 2.00, initialPct: 0.0419, finalPct: 0.066 },
      { min: 2.00, max: 2.50, initialPct: 0.066, finalPct: 0.0844 },
      { min: 2.50, max: 3.00, initialPct: 0.0844, finalPct: 0.0996 },
      { min: 3.00, max: 4.01, initialPct: 0.0996, finalPct: 0.0996 },
    ];

    function getFPL(householdSize) {
      return FPL_BASE + (householdSize - 1) * FPL_INCREMENT;
    }

    function getApplicablePercentage(fplPercent) {
      const ratio = fplPercent / 100;
      for (const bracket of APPLICABLE_PERCENTAGES) {
        if (ratio >= bracket.min && ratio < bracket.max) {
          const position = (ratio - bracket.min) / (bracket.max - bracket.min);
          return bracket.initialPct + position * (bracket.finalPct - bracket.initialPct);
        }
      }
      return null;
    }

    function formatCurrency(amount) {
      return new Intl.NumberFormat("en-US", {
        style: "currency",
        currency: "USD",
        minimumFractionDigits: 0,
        maximumFractionDigits: 0,
      }).format(amount);
    }

    function formatCurrencyExact(amount) {
      return new Intl.NumberFormat("en-US", {
        style: "currency",
        currency: "USD",
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      }).format(amount);
    }

    // Animated counter
    function AnimatedNumber({ value, format = "currency", duration = 600 }) {
      const [display, setDisplay] = useState(0);
      const frameRef = useRef(null);
      const startRef = useRef(null);
      const fromRef = useRef(0);

      useEffect(() => {
        fromRef.current = display;
        startRef.current = null;
        if (frameRef.current) cancelAnimationFrame(frameRef.current);

        function step(ts) {
          if (!startRef.current) startRef.current = ts;
          const progress = Math.min((ts - startRef.current) / duration, 1);
          const ease = 1 - Math.pow(1 - progress, 3);
          setDisplay(fromRef.current + (value - fromRef.current) * ease);
          if (progress < 1) frameRef.current = requestAnimationFrame(step);
        }
        frameRef.current = requestAnimationFrame(step);
        return () => cancelAnimationFrame(frameRef.current);
      }, [value]);

      if (format === "currency") return formatCurrency(Math.round(display));
      if (format === "currencyExact") return formatCurrencyExact(display);
      if (format === "percent") return `${display.toFixed(1)}%`;
      return Math.round(display);
    }

    function ACASubsidyEstimator() {
      const [householdSize, setHouseholdSize] = useState(1);
      const [income, setIncome] = useState("");
      const [incomeInput, setIncomeInput] = useState("");
      const [result, setResult] = useState(null);
      const [showResult, setShowResult] = useState(false);
      const resultRef = useRef(null);

      function handleIncomeChange(e) {
        const raw = e.target.value.replace(/[^0-9]/g, "");
        setIncomeInput(raw);
        setIncome(raw ? parseInt(raw, 10) : "");
      }

      function formatIncomeDisplay(val) {
        if (!val) return "";
        const num = typeof val === "string" ? parseInt(val, 10) : val;
        if (isNaN(num)) return "";
        return new Intl.NumberFormat("en-US").format(num);
      }

      function calculate() {
        if (!income || income < 1) return;

        const fpl = getFPL(householdSize);
        const fplPercent = (income / fpl) * 100;

        let status, monthlyContribution, annualContribution, applicablePct;

        if (fplPercent < 100) {
          status = "gap";
        } else if (fplPercent > 400) {
          status = "over";
        } else {
          status = "eligible";
          applicablePct = getApplicablePercentage(fplPercent);
          annualContribution = income * applicablePct;
          monthlyContribution = annualContribution / 12;
        }

        setResult({
          fpl,
          fplPercent,
          status,
          monthlyContribution,
          annualContribution,
          applicablePct,
        });
        setShowResult(true);

        // Track calculation event
        if (typeof gtag === "function") {
          gtag("event", "subsidy_calculated", {
            event_category: "calculator",
            event_label: status,
            value: Math.round(fplPercent),
          });
        }

          fbq("track", "Lead", { content_name: "subsidy_calculator", status: status });
        }

        setTimeout(() => {
          resultRef.current?.scrollIntoView({ behavior: "smooth", block: "start" });
        }, 100);
      }
